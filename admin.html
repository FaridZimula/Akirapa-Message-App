<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akirapa Admin Panel</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="apple-touch-icon" href="logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        .admin-container {
            display: flex;
            height: 100vh;
            background: #ffffff;
        }
        .admin-sidebar {
            width: 240px;
            background: #761d90;
            border-right: 2px solid #42dcd7;
            padding: 20px;
            display: flex;
            flex-direction: column;
            color: #ffffff;
        }
        .admin-sidebar .logo {
            font-size: 1.35rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .admin-nav {
            flex: 1;
        }
        .admin-nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            color: #ffffff;
            font-weight: 700;
            transition: all 0.2s;
            margin-bottom: 4px;
        }
        .admin-nav-item:hover {
            background: rgba(66, 220, 215, 0.25);
            color: #ffffff;
        }
        .admin-nav-item.active {
            background: #ffffff;
            color: #761d90;
        }
        .admin-content {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
            background: #ffffff;
        }
        .admin-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }
        .stat-card {
            background: #ffffff;
            padding: 20px;
            border-radius: var(--radius-md);
            border: 2px solid #761d90;
            box-shadow: 0 4px 12px rgba(118, 29, 144, 0.1);
        }
        .stat-card .number {
            font-size: 2.2rem;
            font-weight: 700;
            color: #761d90;
        }
        .stat-card .label {
            color: rgba(118, 29, 144, 0.85);
            font-size: 0.88rem;
            font-weight: 700;
        }
        .conversation-view {
            background: #ffffff;
            border-radius: var(--radius-md);
            padding: 16px;
            margin-bottom: 16px;
            border: 1.5px solid #761d90;
            box-shadow: 0 4px 10px rgba(118, 29, 144, 0.08);
        }
        .conversation-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(118, 29, 144, 0.2);
            color: #761d90;
        }
        .participant-tag {
            display: inline-block;
            padding: 3px 10px;
            border-radius: var(--radius-full);
            font-size: 0.75rem;
            background: rgba(118, 29, 144, 0.1);
            margin-right: 4px;
            font-weight: 700;
        }
        .role-badge.admin-view {
            background: #761d90;
            color: #ffffff;
            border: 1px solid #42dcd7;
        }
        .message-preview {
            margin-top: 8px;
            padding: 10px;
            background: rgba(118, 29, 144, 0.05);
            border-radius: var(--radius-sm);
            color: #761d90;
            font-weight: 600;
        }
        .user-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            border-bottom: 1px solid rgba(118, 29, 144, 0.2);
        }
        .user-item:hover {
            background: rgba(66, 220, 215, 0.15);
        }
        .log-item {
            padding: 12px 16px;
            border-bottom: 1px solid rgba(118, 29, 144, 0.2);
            font-size: 0.92rem;
            color: #761d90;
            font-weight: 600;
        }
        .log-item .action {
            font-weight: 700;
            color: #761d90;
        }
        .log-item .time {
            color: rgba(118, 29, 144, 0.65);
            font-size: 0.8rem;
        }
        .online-indicator {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-left: 6px;
        }
        .online-indicator.online {
            background: #42dcd7;
            box-shadow: 0 0 6px #42dcd7;
        }
        .online-indicator.offline {
            background: #761d90;
            opacity: 0.4;
        }
    </style>
</head>
<body>

<div id="authContainer" class="auth-container hidden">
    <div class="auth-card">
        <div class="auth-brand">
            <div class="auth-brand-logo">
                <img src="logo.png" alt="Akirapa Admin Logo" class="auth-brand-logo-img">
            </div>
            <h1 class="auth-title">Admin Access</h1>
            <p class="auth-subtitle">Secure Admin Panel</p>
        </div>
        <form id="adminLoginForm" onsubmit="handleAdminLogin(event)">
            <div class="form-group">
                <label class="form-label">Email Address</label>
                <input type="email" id="adminEmail" class="form-input" required>
            </div>
            <div class="form-group">
                <label class="form-label" for="loginPassword">Password</label>
                <div class="password-input-wrapper">
                    <input type="password" id="loginPassword" class="form-input password-input" placeholder="••••••••" required>
                    <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility('loginPassword', this)" tabindex="-1">
                        <i class="fa-regular fa-eye"></i>
                    </button>
                </div>
            </div>
            <button type="submit" class="btn-primary">Sign In as Admin</button>
        </form>
    </div>
</div>

<div id="adminApp" class="admin-container hidden">
    <aside class="admin-sidebar">
        <div class="logo">
            <img src="logo.png" alt="Akirapa Logo" style="height: 36px; width: 36px; object-fit: contain; background: #ffffff; border-radius: 8px; padding: 2px; border: 1.5px solid #42dcd7;">
            Akirapa Admin
        </div>
        <nav class="admin-nav">
            <div class="admin-nav-item active" onclick="switchAdminView('dashboard')">
                <i class="fa-solid fa-chart-bar"></i> Dashboard
            </div>
            <div class="admin-nav-item" onclick="switchAdminView('conversations')">
                <i class="fa-solid fa-comments"></i> Conversations
            </div>
            <div class="admin-nav-item" onclick="switchAdminView('users')">
                <i class="fa-solid fa-users"></i> Users
            </div>
            <div class="admin-nav-item" onclick="switchAdminView('audit')">
                <i class="fa-solid fa-clock-rotate-left"></i> Audit Logs
            </div>
        </nav>
        <div style="margin-top: auto;">
            <div class="admin-nav-item" onclick="handleLogout()">
                <i class="fa-solid fa-right-from-bracket"></i> Sign Out
            </div>
        </div>
    </aside>

    <main class="admin-content" id="adminContent">
        <div id="view-dashboard">
            <h2 style="color: #761d90; font-weight: 700; margin-bottom: 16px;">Dashboard</h2>
            <div class="admin-stats" id="dashboardStats">
                <div class="stat-card">
                    <div class="number" id="statUsers">0</div>
                    <div class="label">Total Users</div>
                </div>
                <div class="stat-card">
                    <div class="number" id="statMessages">0</div>
                    <div class="label">Total Messages</div>
                </div>
                <div class="stat-card">
                    <div class="number" id="statConversations">0</div>
                    <div class="label">Active Conversations</div>
                </div>
                <div class="stat-card">
                    <div class="number" id="statOnline">0</div>
                    <div class="label">Online Users</div>
                </div>
            </div>
        </div>

        <div id="view-conversations" class="hidden">
            <h2 style="color: #761d90; font-weight: 700; margin-bottom: 16px;">All Conversations</h2>
            <div id="conversationsList"></div>
        </div>

        <div id="view-users" class="hidden">
            <h2 style="color: #761d90; font-weight: 700; margin-bottom: 16px;">Users</h2>
            <div id="usersList"></div>
        </div>

        <div id="view-audit" class="hidden">
            <h2 style="color: #761d90; font-weight: 700; margin-bottom: 16px;">Audit Logs</h2>
            <div id="auditLogsList"></div>
        </div>
    </main>
</div>

<script src="js/supabase-client.js"></script>
<script>
let currentAdmin = null;
let currentView = 'dashboard';
let socket = null;

async function checkAdminSession() {
    const session = await window.initSupabase();
    const user = window.getCurrentUser();
    if (session && user && user.user_metadata?.role === 'ADMIN') {
        currentAdmin = user;
        document.getElementById('adminApp').classList.remove('hidden');
        document.getElementById('authContainer').classList.add('hidden');
        connectSocket();
        loadDashboard();
    } else {
        document.getElementById('adminApp').classList.add('hidden');
        document.getElementById('authContainer').classList.remove('hidden');
    }
}

function connectSocket() {
    const token = window.getCurrentSession()?.access_token;
    if (!token) return;

    const socketUrl = window.location.protocol.startsWith('http') ? window.location.origin : 'http://localhost:3001';

    socket = io(socketUrl, {
        auth: { token },
        transports: ['websocket', 'polling'],
        reconnection: true
    });

    socket.on('connect', () => {
        console.log('Admin Socket connected');
    });

    socket.on('disconnect', () => {
        console.log('Admin Socket disconnected');
    });

    socket.on('user_status', (data) => {
        // Update online status in UI
        document.querySelectorAll('.user-item').forEach(el => {
            const userId = el.dataset.userId;
            if (userId === data.userId) {
                const statusEl = el.querySelector('.online-indicator');
                if (statusEl) {
                    statusEl.className = `online-indicator ${data.online ? 'online' : 'offline'}`;
                }
            }
        });
        // Update online count
        updateOnlineCount();
    });
}

async function updateOnlineCount() {
    try {
        const response = await fetch('/api/health');
        const data = await response.json();
        document.getElementById('statOnline').textContent = data.onlineUsers || 0;
    } catch (err) {
        console.error('Error fetching online count:', err);
    }
}

async function handleAdminLogin(e) {
    e.preventDefault();
    const email = document.getElementById('adminEmail').value;
    const password = document.getElementById('loginPassword').value;
    try {
        await window.signInWithSupabase(email, password);
        const user = window.getCurrentUser();
        if (user?.user_metadata?.role !== 'ADMIN') {
            alert('Admin access required');
            await window.signOutWithSupabase();
            return;
        }
        currentAdmin = user;
        document.getElementById('adminApp').classList.remove('hidden');
        document.getElementById('authContainer').classList.add('hidden');
        connectSocket();
        loadDashboard();
    } catch (err) {
        alert('Login failed: ' + err.message);
    }
}

async function loadDashboard() {
    try {
        const token = window.getCurrentSession()?.access_token;
        const [usersRes, convRes, healthRes] = await Promise.all([
            fetch('/api/admin/users', {
                headers: { 'Authorization': `Bearer ${token}` }
            }),
            fetch('/api/messages/conversations', {
                headers: { 'Authorization': `Bearer ${token}` }
            }),
            fetch('/api/health')
        ]);

        const users = await usersRes.json();
        const conversations = await convRes.json();
        const health = await healthRes.json();

        document.getElementById('statUsers').textContent = users.users?.length || 0;
        document.getElementById('statConversations').textContent = conversations.conversations?.length || 0;
        document.getElementById('statOnline').textContent = health.onlineUsers || 0;
    } catch (err) {
        console.error('Dashboard error:', err);
    }
}

async function loadUsers() {
    try {
        const token = window.getCurrentSession()?.access_token;
        const response = await fetch('/api/admin/users', {
            headers: { 'Authorization': `Bearer ${token}` }
        });
        const data = await response.json();
        const container = document.getElementById('usersList');
        if (!data.users || data.users.length === 0) {
            container.innerHTML = '<p style="color: #761d90; font-weight: 600;">No users found.</p>';
            return;
        }
        container.innerHTML = data.users.map(user => `
            <div class="user-item" data-user-id="${user.id}">
                <div>
                    <strong style="color: #761d90;">${user.name}</strong>
                    <span class="role-badge ${user.role}">${user.role}</span>
                    <span class="online-indicator ${user.online_status ? 'online' : 'offline'}"></span>
                </div>
                <span style="font-size: 0.85rem; color: #761d90; font-weight: 600;">
                    ${user.email || 'No email'}
                </span>
            </div>
        `).join('');
    } catch (err) {
        console.error('Load users error:', err);
    }
}

async function loadConversationsAdmin() {
    try {
        const token = window.getCurrentSession()?.access_token;
        const response = await fetch('/api/messages/conversations', {
            headers: { 'Authorization': `Bearer ${token}` }
        });
        const data = await response.json();
        const container = document.getElementById('conversationsList');
        if (!data.conversations || data.conversations.length === 0) {
            container.innerHTML = '<p style="color: #761d90; font-weight: 600;">No conversations found.</p>';
            return;
        }
        container.innerHTML = data.conversations.map(conv => `
            <div class="conversation-view">
                <div class="conversation-header">
                    <div>
                        <strong>${conv.name}</strong>
                        ${conv.participants?.map(p => `<span class="participant-tag role-badge ${p.role}">${p.name} (${p.role})</span>`).join('')}
                    </div>
                    <span style="font-size: 0.85rem; color: #761d90; font-weight: 600;">
                        ${new Date(conv.last_message_time || conv.created_at).toLocaleString()}
                    </span>
                </div>
                <div class="message-preview">
                    ${conv.last_message || 'No messages yet'}
                </div>
            </div>
        `).join('');
    } catch (err) {
        console.error('Load conversations error:', err);
    }
}

async function loadAuditLogs() {
    try {
        const token = window.getCurrentSession()?.access_token;
        const response = await fetch('/api/admin/audit-logs', {
            headers: { 'Authorization': `Bearer ${token}` }
        });
        const data = await response.json();
        const container = document.getElementById('auditLogsList');
        if (!data.logs || data.logs.length === 0) {
            container.innerHTML = '<p style="color: #761d90; font-weight: 600;">No audit logs found.</p>';
            return;
        }
        container.innerHTML = data.logs.map(log => `
            <div class="log-item">
                <div>
                    <span class="action">${log.action}</span>
                    by ${log.admin?.name || 'Unknown'}
                    <span class="time">${new Date(log.created_at).toLocaleString()}</span>
                </div>
                ${log.details ? `<div style="font-size: 0.8rem; color: #761d90; margin-top: 4px;">${JSON.stringify(log.details)}</div>` : ''}
            </div>
        `).join('');
    } catch (err) {
        console.error('Load audit logs error:', err);
    }
}

function switchAdminView(view) {
    currentView = view;
    document.querySelectorAll('.admin-nav-item').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.admin-nav-item').forEach(el => {
        if (el.textContent.trim().toLowerCase().includes(view)) {
            el.classList.add('active');
        }
    });
    document.querySelectorAll('[id^="view-"]').forEach(el => el.classList.add('hidden'));
    document.getElementById(`view-${view}`).classList.remove('hidden');
    
    switch(view) {
        case 'dashboard': loadDashboard(); break;
        case 'users': loadUsers(); break;
        case 'audit': loadAuditLogs(); break;
        case 'conversations': loadConversationsAdmin(); break;
    }
}

async function handleLogout() {
    try {
        if (socket) {
            socket.disconnect();
            socket = null;
        }
        await window.signOutWithSupabase();
        currentAdmin = null;
        document.getElementById('adminApp').classList.add('hidden');
        document.getElementById('authContainer').classList.remove('hidden');
    } catch (err) {
        console.error('Logout error:', err);
    }
}

function togglePasswordVisibility(inputId, buttonElement) {
    const input = document.getElementById(inputId);
    const icon = buttonElement.querySelector('i');
    if (input.type === 'password') {
        input.type = 'text';
        icon.className = 'fa-regular fa-eye-slash';
    } else {
        input.type = 'password';
        icon.className = 'fa-regular fa-eye';
    }
}

document.addEventListener('DOMContentLoaded', checkAdminSession);
</script>
</body>
</html>
